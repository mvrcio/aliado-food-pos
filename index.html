<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#BF230E"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><title>Aliado Food · POS</title>
<style>
:root{--red:#BF230E;--org:#F0991C;--bg:#FAF6F1;--card:#fff;--tx:#2a1a14;--mu:#7a6a62;--bd:#e8dcd2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1412;--card:#2a1e1a;--tx:#f5ece6;--mu:#b5a39a;--bd:#4a3a33}}
*{box-sizing:border-box}body{margin:0;font-family:Poppins,system-ui,sans-serif;background:var(--bg);color:var(--tx);font-size:14px}
button,input,select{font:inherit;color:inherit}
header{background:var(--red);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:20px}
header b{font-size:17px;letter-spacing:.5px}header small{opacity:.85;display:block;font-size:11px}
nav{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;background:var(--card);border-bottom:2px solid var(--org)}
nav button{border:0;background:transparent;padding:8px 14px;border-radius:20px;cursor:pointer;white-space:nowrap;font-weight:600}
nav button.on{background:var(--red);color:#fff}
main{padding:14px;max-width:1200px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.prod{border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:12px;cursor:pointer;text-align:left}
.prod:hover{border-color:var(--org)}.prod b{display:block}.prod span{color:var(--red);font-weight:700}
.pos{display:grid;grid-template-columns:1fr 340px;gap:12px}@media(max-width:820px){.pos{grid-template-columns:1fr}}
.btn{background:var(--red);color:#fff;border:0;padding:9px 16px;border-radius:8px;cursor:pointer;font-weight:600}
.btn.o{background:var(--org);color:#2a1a14}.btn.g{background:transparent;color:var(--red);border:1px solid var(--red)}
input,select{padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--card);width:100%;margin:3px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0}
.tot{font-size:20px;font-weight:700;color:var(--red)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;background:var(--org);color:#2a1a14;font-size:11px;font-weight:700}
.low{color:var(--red);font-weight:700}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--bd);text-align:left}
.wrap{overflow-x:auto}
#login{max-width:360px;margin:8vh auto;text-align:center}
#modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:9}
#modal.s{display:grid}#rc{background:#fff;color:#000;width:300px;padding:16px;font-family:monospace;font-size:12px;border-radius:8px;max-height:90vh;overflow:auto}
@media print{body *{visibility:hidden}#rc,#rc *{visibility:visible}#rc{position:absolute;left:0;top:0}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"><div><div id="rc"></div><div style="text-align:center;margin-top:8px"><button class="btn o" onclick="print()">Imprimir</button> <button class="btn" onclick="$('#modal').classList.remove('s')">Fechar</button></div></div></div>
<script>
const $=s=>document.querySelector(s);
const e=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const kz=n=>Number(n).toLocaleString('pt-PT')+' Kz';
const CO={name:'Aliado Sabores - Comércio e Serviços (SU), Lda.',nif:'5002726300',tel:'929 809 889',mail:'aliadofood@hotmail.com'};
const ROLES={
 ceo:{n:'CEO / Administrador',pin:'1111',tabs:['pdv','kds','entregas','estoque','produtos','aliado','financas']},
 ops:{n:'Director de Operações',pin:'2222',tabs:['kds','entregas','estoque','financas']},
 chef:{n:'Chef',pin:'3333',tabs:['kds','estoque']},
 ajud:{n:'Assistente de Cozinha',pin:'4444',tabs:['kds']},
 compras:{n:'Compras e Estoque',pin:'5555',tabs:['estoque']},
 estafeta:{n:'Estafeta / Entregador',pin:'6666',tabs:['entregas']},
 conta:{n:'Contabilista Externo (só leitura)',pin:'7777',tabs:['financas']}
};
const TN={pdv:'🧾 Caixa / PDV',kds:'👨‍🍳 Cozinha',entregas:'🛵 Entregas',estoque:'📦 Compras e Estoque',produtos:'🏷️ Preços',aliado:'⭐ ALIADO+',financas:'📊 Finanças'};
const seed={
 prods:[['Hambúrguer Aliado','Lanches',3500],['Sanduíche Misto','Lanches',2000],['Pizza Individual','Lanches',4000],['Frango Grelhado c/ Arroz','Pratos',4500],['Muamba de Galinha','Pratos',5000],['Calulu','Pratos',5500],['Sumo Natural','Bebidas',1200],['Refrigerante','Bebidas',800],['Água','Bebidas',500],['Sobremesa do Dia','Sobremesas',1500]].map((p,i)=>({id:i+1,name:p[0],cat:p[1],price:p[2]})),
 stock:[['Frango','kg',20,8],['Arroz','kg',30,10],['Óleo','L',10,4],['Farinha','kg',15,5],['Bebidas','un',60,20],['Embalagens','un',200,50]].map((s,i)=>({id:i+1,name:s[0],unit:s[1],qty:s[2],min:s[3]})),
 orders:[],exp:[],cust:{},couriers:['Estafeta 1','Estafeta 2'],seq:1
};
let S;try{S=JSON.parse(localStorage.getItem('af_pos'))}catch(x){}
if(!S)S=seed;
const save=()=>{try{localStorage.setItem('af_pos',JSON.stringify(S))}catch(x){}};
let role=null,tab=null,cart=[],cat='Todos',F={type:'Balcão',pay:'Dinheiro',name:'',phone:'',addr:'',redeem:false};
const today=()=>new Date().toISOString().slice(0,10);
const IVA=0.14;

function login(){
 $('#app').innerHTML=`<div id="login" class="card"><img src="icon-192.png" width="72" height="72" alt="Aliado Food">
 <h2 style="color:var(--red);margin:8px 0 0">ALIADO FOOD</h2><p style="color:var(--mu);margin-top:0">Seu aliado na fome.</p>
 <select id="lr">${Object.entries(ROLES).map(([k,r])=>`<option value="${k}">${r.n}</option>`).join('')}</select>
 <input id="lp" type="password" inputmode="numeric" placeholder="PIN"><button class="btn" style="width:100%;margin-top:8px" onclick="doLogin()">Entrar</button>
 <p id="le" style="color:var(--red)"></p><small style="color:var(--mu)">PIN de demonstração: 1111 a 7777 pela ordem da lista. Altere antes de usar em produção.</small></div>`;
}
function doLogin(){const r=$('#lr').value;if($('#lp').value===ROLES[r].pin){role=r;tab=ROLES[r].tabs[0];cart=[];draw()}else $('#le').textContent='PIN incorrecto'}
function draw(){
 const R=ROLES[role];
 $('#app').innerHTML=`<header><img src="icon-192.png" width="38" height="38" alt="" style="border-radius:50%"><div><b>ALIADO FOOD</b><small>${R.n}</small></div><span style="flex:1"></span><button class="btn o" onclick="role=null;login()">Sair</button></header>
 <nav>${R.tabs.map(t=>`<button class="${t==tab?'on':''}" onclick="tab='${t}';draw()">${TN[t]}</button>`).join('')}</nav><main>${views[tab]()}</main>`;
}
const cartTot=()=>cart.reduce((a,i)=>a+i.price*i.q,0);
const disc=()=>{const c=S.cust[F.phone];return F.redeem&&c?Math.min(c.points*10,cartTot()):0};
const views={
pdv(){
 const cats=['Todos',...new Set(S.prods.map(p=>p.cat))];const t=cartTot(),d=disc(),tot=t-d;
 return `<div class="pos"><div><div style="display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap">${cats.map(c=>`<button class="btn ${c==cat?'':'g'}" onclick="cat='${c}';draw()">${c}</button>`).join('')}</div>
 <div class="grid">${S.prods.filter(p=>cat=='Todos'||p.cat==cat).map(p=>`<button class="prod" onclick="add(${p.id})"><b>${e(p.name)}</b><span>${kz(p.price)}</span></button>`).join('')}</div></div>
 <div class="card"><h3 style="margin-top:0">Pedido</h3>
 ${cart.map(i=>`<div class="row"><span>${e(i.name)}</span><span><button class="btn g" onclick="qty(${i.id},-1)">−</button> ${i.q} <button class="btn g" onclick="qty(${i.id},1)">+</button></span><b>${kz(i.price*i.q)}</b></div>`).join('')||'<p style="color:var(--mu)">Carrinho vazio</p>'}
 <hr style="border-color:var(--bd)">
 <select onchange="F.type=this.value;draw()"><option ${F.type=='Balcão'?'selected':''}>Balcão</option><option ${F.type=='Entrega'?'selected':''}>Entrega</option></select>
 <input placeholder="Telemóvel do cliente (ALIADO+)" value="${e(F.phone)}" onchange="F.phone=this.value;draw()">
 <input placeholder="Nome" value="${e(F.name)}" onchange="F.name=this.value">
 ${F.type=='Entrega'?`<input placeholder="Endereço de entrega" value="${e(F.addr)}" onchange="F.addr=this.value">`:''}
 <select onchange="F.pay=this.value">${['Dinheiro','TPA / Multicaixa','Transferência','Express'].map(p=>`<option ${F.pay==p?'selected':''}>${p}</option>`).join('')}</select>
 ${S.cust[F.phone]?`<label><input type="checkbox" style="width:auto" ${F.redeem?'checked':''} onchange="F.redeem=this.checked;draw()"> Usar ${S.cust[F.phone].points} pontos ALIADO+ (−${kz(Math.min(S.cust[F.phone].points*10,t))})</label>`:''}
 <div class="row"><span>IVA incluído (14%)</span><span>${kz(Math.round(tot-tot/(1+IVA)))}</span></div>
 <div class="row"><b>Total</b><span class="tot">${kz(tot)}</span></div>
 <button class="btn" style="width:100%" onclick="finish()">Finalizar venda</button></div></div>`;
},
kds(){
 const col=(s,t,nx)=>`<div><h3 style="color:var(--red)">${t}</h3>${S.orders.filter(o=>o.status==s).map(o=>`<div class="card"><b>#${o.id}</b> <span class="tag">${o.type}</span><br>${o.items.map(i=>`${i.q}× ${e(i.name)}`).join('<br>')}<br><button class="btn o" style="margin-top:8px" onclick="adv(${o.id})">${nx}</button></div>`).join('')||'<p style="color:var(--mu)">—</p>'}</div>`;
 return `<div class="cols">${col('novo','Novos','Iniciar preparo')}${col('preparo','Em preparo','Marcar pronto')}${col('pronto','Prontos','Entregue ao cliente / expedir')}</div>`;
},
entregas(){
 const L=S.orders.filter(o=>o.type=='Entrega'&&['pronto','a caminho'].includes(o.status));
 return L.map(o=>`<div class="card"><b>#${o.id}</b> <span class="tag">${o.status}</span><br>${e(o.name)} · ${e(o.phone)}<br>📍 ${e(o.addr)}<br>${o.items.map(i=>`${i.q}× ${e(i.name)}`).join(', ')} · <b>${kz(o.total)}</b><br>
 ${o.status=='pronto'?`<select id="c${o.id}">${S.couriers.map(c=>`<option>${e(c)}</option>`).join('')}</select><button class="btn" onclick="go(${o.id})">Saiu para entrega</button>`:`🛵 ${e(o.courier)} <button class="btn o" onclick="done(${o.id})">Confirmar entrega</button>`}</div>`).join('')||'<p>Sem entregas pendentes.</p>';
},
estoque(){
 const w=role=='ceo'||role=='ops'||role=='compras';
 return `<div class="card wrap"><table><tr><th>Item</th><th>Qtd</th><th>Mínimo</th><th></th></tr>${S.stock.map(s=>`<tr><td>${e(s.name)}</td><td class="${s.qty<=s.min?'low':''}">${s.qty} ${s.unit}</td><td>${s.min}</td><td>${s.qty<=s.min?'⚠️ Repor':'OK'}</td></tr>`).join('')}</table></div>
 ${w?`<div class="card"><h3 style="margin-top:0">Registar compra</h3><select id="si">${S.stock.map(s=>`<option value="${s.id}">${e(s.name)}</option>`).join('')}</select><input id="sq" type="number" placeholder="Quantidade"><input id="sc" type="number" placeholder="Custo total (Kz)"><button class="btn" onclick="buy()">Registar entrada</button></div>`:''}`;
},
produtos(){
 return `<div class="card wrap"><table><tr><th>Produto</th><th>Categoria</th><th>Preço (Kz)</th></tr>${S.prods.map(p=>`<tr><td>${e(p.name)}</td><td>${p.cat}</td><td><input type="number" value="${p.price}" onchange="S.prods.find(x=>x.id==${p.id}).price=+this.value;save()"></td></tr>`).join('')}</table></div>
 <div class="card"><h3 style="margin-top:0">Novo produto</h3><input id="pn" placeholder="Nome"><select id="pc"><option>Pratos</option><option>Lanches</option><option>Bebidas</option><option>Sobremesas</option></select><input id="pp" type="number" placeholder="Preço"><button class="btn" onclick="newP()">Adicionar</button></div>`;
},
aliado(){
 return `<div class="card"><h3 style="margin-top:0">Programa ALIADO+</h3><p>1 ponto por cada 100 Kz gastos. 1 ponto = 10 Kz de desconto.</p><table><tr><th>Cliente</th><th>Telemóvel</th><th>Pontos</th></tr>${Object.entries(S.cust).map(([p,c])=>`<tr><td>${e(c.name)}</td><td>${e(p)}</td><td>${c.points}</td></tr>`).join('')||'<tr><td colspan=3>Sem membros ainda</td></tr>'}</table></div>`;
},
financas(){
 const O=S.orders.filter(o=>o.date==today()),T=O.reduce((a,o)=>a+o.total,0),X=S.exp.filter(x=>x.date==today()).reduce((a,x)=>a+x.v,0);
 const by={};O.forEach(o=>by[o.pay]=(by[o.pay]||0)+o.total);
 return `<div class="cols"><div class="card">Vendas hoje<div class="tot">${kz(T)}</div></div><div class="card">Despesas hoje<div class="tot">${kz(X)}</div></div><div class="card">Resultado<div class="tot">${kz(T-X)}</div></div><div class="card">Pedidos<div class="tot">${O.length}</div></div></div>
 <div class="card"><h3 style="margin-top:0">Recebimentos por método</h3>${Object.entries(by).map(([k,v])=>`<div class="row"><span>${k}</span><b>${kz(v)}</b></div>`).join('')||'—'}</div>
 ${role=='ceo'?`<div class="card"><h3 style="margin-top:0">Lançar despesa</h3><input id="xd" placeholder="Descrição"><input id="xv" type="number" placeholder="Valor (Kz)"><button class="btn" onclick="expn()">Lançar</button></div>`:''}
 <div class="card wrap"><h3 style="margin-top:0">Vendas</h3><table><tr><th>#</th><th>Data</th><th>Tipo</th><th>Pagamento</th><th>Total</th><th></th></tr>${S.orders.slice().reverse().slice(0,30).map(o=>`<tr><td>${o.id}</td><td>${o.date}</td><td>${o.type}</td><td>${o.pay}</td><td>${kz(o.total)}</td><td><button class="btn g" onclick="receipt(${o.id})">Recibo</button></td></tr>`).join('')}</table></div>
 <button class="btn o" onclick="print()">Imprimir relatório</button>`;
}};
function add(id){const p=S.prods.find(x=>x.id==id),i=cart.find(x=>x.id==id);i?i.q++:cart.push({id,name:p.name,price:p.price,q:1});draw()}
function qty(id,d){const i=cart.find(x=>x.id==id);i.q+=d;if(i.q<1)cart=cart.filter(x=>x.id!=id);draw()}
function finish(){
 if(!cart.length)return;if(F.type=='Entrega'&&!F.addr){alert('Indique o endereço de entrega');return}
 const t=cartTot(),d=disc(),tot=t-d,pts=Math.floor(tot/100);
 if(F.phone){const c=S.cust[F.phone]||(S.cust[F.phone]={name:F.name||'Cliente',points:0});if(F.name)c.name=F.name;if(d)c.points-=d/10;c.points+=pts}
 const o={id:S.seq++,date:today(),ts:new Date().toLocaleString('pt-PT'),items:cart,total:tot,disc:d,type:F.type,pay:F.pay,name:F.name||'Cliente',phone:F.phone,addr:F.addr,status:'novo',pts};
 S.orders.push(o);save();cart=[];F={type:'Balcão',pay:'Dinheiro',name:'',phone:'',addr:'',redeem:false};draw();receipt(o.id)
}
function receipt(id){const o=S.orders.find(x=>x.id==id);
 $('#rc').innerHTML=`<center><b>ALIADO FOOD</b><br>${CO.name}<br>NIF ${CO.nif}<br>Tel ${CO.tel}<br>${CO.mail}</center>--------------------------<br>Pedido #${o.id} · ${o.ts}<br>${o.type}${o.addr?' · '+e(o.addr):''}<br>--------------------------<br>${o.items.map(i=>`${i.q}× ${e(i.name)}<br>&nbsp;&nbsp;${kz(i.price*i.q)}`).join('<br>')}<br>--------------------------<br>${o.disc?`Desconto ALIADO+: -${kz(o.disc)}<br>`:''}<b>TOTAL: ${kz(o.total)}</b><br>IVA incl. 14%: ${kz(Math.round(o.total-o.total/(1+IVA)))}<br>Pago: ${o.pay}<br>${o.phone?`Pontos ganhos: ${o.pts}<br>`:''}<center>Seu aliado na fome.</center>`;
 $('#modal').classList.add('s')}
function adv(id){const o=S.orders.find(x=>x.id==id);o.status=o.status=='novo'?'preparo':o.status=='preparo'?'pronto':(o.type=='Entrega'?'pronto':'entregue');save();draw()}
function go(id){const o=S.orders.find(x=>x.id==id);o.courier=$('#c'+id).value;o.status='a caminho';save();draw()}
function done(id){S.orders.find(x=>x.id==id).status='entregue';save();draw()}
function buy(){const s=S.stock.find(x=>x.id==$('#si').value),q=+$('#sq').value,c=+$('#sc').value;if(!q)return;s.qty+=q;if(c)S.exp.push({date:today(),d:'Compra: '+s.name,v:c});save();draw()}
function newP(){const n=$('#pn').value,p=+$('#pp').value;if(!n||!p)return;S.prods.push({id:Date.now(),name:n,cat:$('#pc').value,price:p});save();draw()}
function expn(){const v=+$('#xv').value;if(!v)return;S.exp.push({date:today(),d:$('#xd').value,v});save();draw()}
login();
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
</body>
</html>
